<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News · 풀링FC</title>
<style>
  :root{
    --pitch-950:#0F1F17; --pitch-800:#1C3829; --pitch-700:#284A36;
    --paper:#EEEEE2; --chalk:#FBFAF3; --gold:#D9A441; --gold-dim:#B98A38;
    --ink:#14231B; --line:#D8D6C8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{ background:var(--paper); color:var(--ink); font-family:'Work Sans','Segoe UI',-apple-system,sans-serif; line-height:1.55; }
  h1,h2,h3{ font-family:'Oswald','Arial Narrow',sans-serif; font-weight:600; letter-spacing:0.01em; color:var(--pitch-950); }
  a{color:inherit; text-decoration:none;}
  img{max-width:100%; display:block;}
  .wrap{max-width:1120px; margin:0 auto; padding:0 24px;}

  header{ position:sticky; top:0; z-index:50; background:var(--pitch-950); border-bottom:1px solid rgba(217,164,65,0.25); }
  .navbar{ display:flex; align-items:center; justify-content:space-between; padding:10px 24px; max-width:1120px; margin:0 auto; }
  .brand{ display:flex; align-items:center; gap:10px; color:var(--chalk); }
  .crest{ width:42px; height:42px; flex:none; border-radius:50%; }
  .brand-name{ font-family:'Oswald',sans-serif; font-size:19px; font-weight:600; color:var(--chalk); letter-spacing:0.02em; }
  nav ul{ list-style:none; display:flex; gap:6px; }
  nav a{ display:block; padding:8px 14px; border-radius:2px; color:#CFE0D3; font-size:14.5px; font-weight:500; border-bottom:2px solid transparent; transition:color .15s ease, border-color .15s ease; }
  nav a:hover, nav a.active{ color:var(--chalk); border-bottom-color:var(--gold); }
  .nav-toggle{ display:none; background:none; border:none; color:var(--chalk); font-size:22px; cursor:pointer; }
  @media (max-width:820px){
    nav{ position:absolute; top:62px; left:0; right:0; background:var(--pitch-950); display:none; border-bottom:1px solid rgba(217,164,65,0.25); }
    nav.open{ display:block; }
    nav ul{ flex-direction:column; padding:8px 24px 16px; gap:0; }
    nav a{ padding:12px 4px; border-bottom:1px solid rgba(255,255,255,0.06); border-radius:0; }
    .nav-toggle{ display:block; }
  }

  .hero{ position:relative; background:radial-gradient(ellipse 900px 500px at 50% -10%, rgba(217,164,65,0.18), transparent 60%), var(--pitch-950); color:var(--chalk); overflow:hidden; padding:88px 24px 110px; }
  .pitch-lines{ position:absolute; inset:0; opacity:0.5; pointer-events:none; }
  .hero-inner{ position:relative; max-width:760px; margin:0 auto; text-align:center; }
  .hero-eyebrow{ display:inline-block; font-size:13.5px; color:var(--gold); border:1px solid rgba(217,164,65,0.5); padding:5px 14px; border-radius:20px; margin-bottom:28px; }
  .hero h1{ font-size:clamp(34px,6vw,54px); color:var(--chalk); line-height:1.1; margin-bottom:16px; }
  .hero h1 span{ color:var(--gold); }
  .hero p.lede{ font-size:16px; color:#D7DED7; max-width:560px; margin:0 auto 10px; }
  .hero-actions{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:24px;}
  .btn{ display:inline-block; padding:12px 26px; font-size:15px; font-weight:600; border-radius:2px; cursor:pointer; border:1px solid transparent; }
  .btn-gold{ background:var(--gold); color:var(--pitch-950); }
  .btn-gold:hover{ background:var(--gold-dim); }
  .btn-outline{ border-color:rgba(251,250,243,0.4); color:var(--chalk); }
  .btn-outline:hover{ border-color:var(--chalk); }
  .btn-gold-sm{ background:var(--gold); color:var(--pitch-950); font-size:13.5px; font-weight:700; padding:9px 16px; border-radius:2px; white-space:nowrap; display:inline-block; }
  .btn-gold-sm:hover{ background:var(--gold-dim); }

  section{ padding:76px 0; }
  .section-head{ margin-bottom:40px; max-width:640px; }
  .section-kicker{ font-size:13.5px; color:var(--gold-dim); font-weight:600; margin-bottom:8px; }
  .section-head h2{ font-size:32px; }
  .section-head p{ color:#4B5A50; margin-top:10px; font-size:15.5px; }

  #news{ background:var(--paper); }
  .news-grid{ display:grid; grid-template-columns:1.2fr 1fr 1fr; gap:22px; }
  .news-card{ background:var(--chalk); border:1px solid var(--line); display:flex; flex-direction:column; }
  .news-card.feature{ grid-row:span 2; }
  .news-thumb{ aspect-ratio:16/10; background:linear-gradient(135deg,var(--pitch-800),var(--pitch-950)); position:relative; flex:none; }
  .news-card.feature .news-thumb{ aspect-ratio:16/11; }
  .news-thumb .tag{ position:absolute; bottom:12px; left:12px; background:var(--gold); color:var(--pitch-950); font-size:12px; font-weight:700; padding:4px 10px; }
  .news-body{ padding:18px 20px 22px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .news-date{ font-size:12.5px; color:#7C887F; }
  .news-body h3{ font-size:18px; line-height:1.3; }
  .news-card.feature h3{ font-size:23px; }
  .news-body p{ font-size:14px; color:#4B5A50; }

  .dark-section{ background:var(--pitch-950); color:var(--chalk); }
  .dark-section .section-head p{ color:#B9C4BB; }
  .dark-section .section-kicker{ color:var(--gold); }

  .roster{ display:grid; grid-template-columns:repeat(6,1fr); gap:16px; }
  .player-card{ background:var(--pitch-800); border:1px solid rgba(217,164,65,0.18); padding:18px 10px; text-align:center; }
  .avatar-photo{ width:84px; height:84px; margin:0 auto 12px; }
  .avatar-photo img{ width:100%; height:100%; border-radius:50%; object-fit:cover; }
  .player-card h3{ color:var(--chalk); font-size:15px; }
  .player-card .sub{ font-size:12px; color:#9FB0A4; margin-top:2px; }

  .name-card{ background:var(--pitch-800); border:1px solid rgba(217,164,65,0.18); padding:16px 8px; text-align:center; }
  .name-card .initial{ width:52px; height:52px; margin:0 auto 10px; border-radius:50%; background:var(--gold); color:var(--pitch-950); display:flex; align-items:center; justify-content:center; font-family:'Oswald',sans-serif; font-weight:700; font-size:18px;}
  .name-card h3{ color:var(--chalk); font-size:14.5px; }
  .name-card .sub{ font-size:11.5px; color:#9FB0A4; margin-top:3px; }
  .name-roster{ display:grid; grid-template-columns:repeat(7,1fr); gap:12px; }

  #match{ background:var(--paper); }
  .match-card{ background:var(--chalk); border:1px solid var(--line); }
  .match-card-head{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:26px 30px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .match-title{ font-family:'Oswald',sans-serif; font-size:21px; }
  .match-meta{ font-size:13.5px; color:#7C887F; margin-top:4px; }
  .match-body{ display:grid; grid-template-columns:1.3fr 1fr; gap:0; }
  .goal-log{ padding:26px 30px; border-right:1px solid var(--line); max-height:420px; overflow-y:auto; }
  .goal-log h4, .leaderboard h4{ font-size:14px; color:var(--gold-dim); margin-bottom:14px; letter-spacing:0.02em; }
  .goal-log ul{ list-style:none; display:flex; flex-direction:column; gap:9px; }
  .goal-log li a{ display:flex; gap:10px; font-size:14px; align-items:baseline; }
  .goal-log li a:hover .ts{ color:var(--pitch-950); background:var(--gold); }
  .goal-log .ts{ flex:none; font-family:'Oswald',sans-serif; font-size:12px; color:var(--gold-dim); border:1px solid var(--line); padding:2px 7px; border-radius:2px; }
  .leaderboard{ padding:26px 30px; }
  .leaderboard table{ width:100%; border-collapse:collapse; font-size:14.5px; }
  .leaderboard th{ text-align:left; font-size:12px; color:#7C887F; padding-bottom:8px; border-bottom:1px solid var(--line); font-weight:600; }
  .leaderboard td{ padding:7px 0; border-bottom:1px solid var(--line); }
  .leaderboard td:not(:first-child){ text-align:center; }
  .leaderboard th:not(:first-child){ text-align:center; }
  tr.guest-row{ color:#9AA69C; font-style:italic; }
  .board-note{ font-size:12px; color:#9AA69C; margin-top:12px; }

  #video{ background:var(--pitch-950); color:var(--chalk); }
  .video-frame{ position:relative; aspect-ratio:16/9; border:1px solid rgba(217,164,65,0.25); overflow:hidden; }
  .video-frame iframe{ width:100%; height:100%; border:0; display:block; }
  .video-caption{ display:flex; justify-content:space-between; margin-top:16px; font-size:14px; color:#B9C4BB; flex-wrap:wrap; gap:10px;}
  .video-caption a{ color:var(--gold); font-weight:600; }

  #story{ background:var(--paper); }
  .story-layout{ display:grid; grid-template-columns:0.9fr 1.1fr; gap:56px; align-items:start; }
  .story-copy p{ margin-bottom:16px; color:#3A473F; font-size:15.5px; }
  .timeline{ border-left:2px solid var(--line); padding-left:24px; display:flex; flex-direction:column; gap:26px; }
  .timeline .t-item{ position:relative; }
  .timeline .t-item::before{ content:''; position:absolute; left:-30px; top:4px; width:10px; height:10px; border-radius:50%; background:var(--gold); }
  .timeline .year{ font-family:'Oswald',sans-serif; font-size:14px; color:var(--gold-dim); font-weight:700; }
  .timeline h4{ font-size:16.5px; margin:4px 0 4px; }
  .timeline p{ font-size:14px; color:#4B5A50; }

  footer{ background:var(--pitch-950); color:#8DA091; text-align:center; padding:36px 24px; font-size:13px; }
  footer .brand-name{ color:var(--chalk); }

  /* Year tabs (story.html / members.html) */
  .year-tabs{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:36px; }
  .year-tab{ padding:10px 22px; border:1px solid var(--line); background:var(--chalk); font-family:'Oswald',sans-serif; font-size:15px; cursor:pointer; color:var(--ink); }
  .year-tab.active{ background:var(--pitch-950); color:var(--chalk); border-color:var(--pitch-950); }
  .year-panel{ display:none; }
  .year-panel.active{ display:block; }
  .badge-latest{ background:var(--gold); color:var(--pitch-950); font-size:11px; font-weight:700; padding:2px 8px; border-radius:10px; margin-left:8px; vertical-align:middle; }

  #tactics{ background:var(--paper); }
  .tactic-tabs{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:32px; }
  .tactic-tab{ padding:10px 20px; border:1px solid var(--line); background:var(--chalk); font-family:'Oswald',sans-serif; font-size:14.5px; cursor:pointer; color:var(--ink); }
  .tactic-tab.active{ background:var(--pitch-950); color:var(--chalk); border-color:var(--pitch-950); }
  .tactic-panel{ display:none; }
  .tactic-panel.active{ display:grid; grid-template-columns:1.3fr 1fr; gap:40px; align-items:start; }
  .tactic-copy{ background:var(--chalk); border:1px solid var(--line); padding:28px 30px; }
  .tactic-copy h4{ font-size:19px; margin-bottom:14px; }
  .tactic-copy p{ font-size:14.5px; color:#3A473F; margin-bottom:14px; }
  .tactic-copy ul{ padding-left:18px; margin-bottom:6px; }
  .tactic-copy li{ font-size:14.5px; color:#3A473F; margin-bottom:6px; }
  .video-list{ background:var(--pitch-950); border:1px solid rgba(217,164,65,0.2); padding:24px 24px; }
  .video-list h4{ font-size:13px; color:var(--gold); letter-spacing:0.02em; margin-bottom:14px; }
  .video-list ol{ list-style:none; display:flex; flex-direction:column; gap:12px; counter-reset:vid; }
  .video-list li{ counter-increment:vid; }
  .video-list a{ display:flex; gap:10px; font-size:13.5px; color:var(--chalk); line-height:1.4; }
  .video-list a::before{ content:counter(vid); flex:none; width:20px; height:20px; border-radius:50%; background:var(--gold); color:var(--pitch-950); font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .video-list a:hover{ color:var(--gold); }
  @media (max-width:900px){
    .tactic-panel.active{ grid-template-columns:1fr; }
  }

  .match-list{ display:flex; flex-direction:column; gap:18px; }
  .match-list-card{ display:flex; gap:22px; background:var(--chalk); border:1px solid var(--line); overflow:hidden; align-items:stretch; text-decoration:none; }
  .match-list-card img{ width:260px; flex:none; object-fit:cover; }
  .match-list-body{ padding:22px 24px; display:flex; flex-direction:column; justify-content:center; gap:6px; }
  .match-list-date{ font-size:12.5px; color:#7C887F; }
  .match-list-body h3{ font-size:19px; }
  .match-list-score{ font-family:'Oswald',sans-serif; font-size:16px; color:var(--pitch-950); }
  .match-list-cta{ font-size:13px; color:var(--gold-dim); font-weight:700; margin-top:6px; }
  @media (max-width:700px){
    .match-list-card{ flex-direction:column; }
    .match-list-card img{ width:100%; aspect-ratio:16/9; }
  }

  .team-rosters{ display:grid; grid-template-columns:1fr 1fr; border-bottom:1px solid var(--line); }
  .team-roster-col{ padding:20px 30px; }
  .team-roster-col:first-child{ border-right:1px solid var(--line); }
  .team-roster-col h4{ font-family:'Oswald',sans-serif; font-size:15px; color:var(--gold-dim); margin-bottom:10px; }
  .team-roster-col ul{ list-style:none; display:flex; flex-wrap:wrap; gap:8px; }
  .team-roster-col li{ font-size:13.5px; background:var(--paper); border:1px solid var(--line); padding:4px 10px; border-radius:12px; }
  @media (max-width:600px){
    .team-rosters{ grid-template-columns:1fr; }
    .team-roster-col:first-child{ border-right:none; border-bottom:1px solid var(--line); }
  }

  .awards-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-bottom:40px; }
  .award-card{ background:var(--chalk); border:1px solid var(--line); padding:18px 14px; text-align:center; }
  .award-card .label{ font-size:12px; color:var(--gold-dim); font-weight:700; margin-bottom:8px; letter-spacing:0.02em; }
  .award-card .val{ font-size:15px; font-weight:600; }

  .stat-table-wrap{ background:var(--chalk); border:1px solid var(--line); overflow-x:auto; }
  table.stat-table{ width:100%; border-collapse:collapse; font-size:14px; min-width:640px; }
  table.stat-table th{ text-align:center; font-size:12px; color:#7C887F; padding:12px 10px; border-bottom:2px solid var(--line); font-weight:700; white-space:nowrap; background:#F4F3EA; }
  table.stat-table th:first-child, table.stat-table td:first-child{ text-align:left; padding-left:18px; }
  table.stat-table td{ text-align:center; padding:9px 10px; border-bottom:1px solid var(--line); }
  table.stat-table tr:nth-child(odd){ background:rgba(217,164,65,0.05); }
  .table-footnote{ font-size:12px; color:#7C887F; margin-top:12px; }
  table.stat-table th.sortable{ cursor:pointer; user-select:none; position:relative; }
  table.stat-table th.sortable:hover{ color:var(--pitch-950); background:#EAE7D8; }
  table.stat-table th.sortable::after{ content:'↕'; margin-left:5px; opacity:0.35; font-size:11px; }
  table.stat-table th.sortable.sort-asc::after{ content:'▲'; opacity:1; color:var(--gold-dim); }
  table.stat-table th.sortable.sort-desc::after{ content:'▼'; opacity:1; color:var(--gold-dim); }
  table.stat-table th:nth-last-child(-n+3), table.stat-table td:nth-last-child(-n+3){ background:rgba(217,164,65,0.12); }

  @media (max-width:900px){
    .news-grid{ grid-template-columns:1fr 1fr; }
    .news-card.feature{ grid-column:span 2; grid-row:auto; }
    .roster{ grid-template-columns:repeat(3,1fr); }
    .name-roster{ grid-template-columns:repeat(4,1fr); }
    .story-layout{ grid-template-columns:1fr; }
    .match-body{ grid-template-columns:1fr; }
    .goal-log{ border-right:none; border-bottom:1px solid var(--line); max-height:none; }
    .awards-grid{ grid-template-columns:repeat(2,1fr); }
  }
  @media (max-width:480px){
    .roster{ grid-template-columns:repeat(2,1fr); }
    .name-roster{ grid-template-columns:repeat(3,1fr); }
  }

  .wed-hero{ position:relative; background:var(--pitch-950); color:var(--chalk); text-align:center; padding:56px 24px 0; }
  .wed-hero img{ max-width:420px; width:100%; margin:0 auto; border:1px solid rgba(217,164,65,0.3); }
  .wed-hero-text{ padding:36px 24px 56px; max-width:520px; margin:0 auto; }
  .wed-hero-text .names{ font-family:'Oswald',sans-serif; font-size:30px; color:var(--chalk); margin-bottom:10px; }
  .wed-hero-text .names span{ color:var(--gold); }
  .wed-hero-text .meta{ font-size:15px; color:#D7DED7; line-height:1.7; }
  .wed-body{ background:var(--paper); padding:64px 24px; }
  .wed-grid{ max-width:1000px; margin:0 auto; display:grid; grid-template-columns:1fr 1.1fr; gap:44px; align-items:start; }
  .wed-info-card{ background:var(--chalk); border:1px solid var(--line); padding:28px 30px; }
  .wed-info-card h3{ font-size:18px; margin-bottom:16px; }
  .wed-info-row{ display:flex; gap:14px; font-size:14.5px; color:#3A473F; padding:10px 0; border-bottom:1px solid var(--line); }
  .wed-info-row:last-child{ border-bottom:none; }
  .wed-info-row b{ flex:none; width:64px; color:var(--gold-dim); }
  .wed-directions img{ border:1px solid var(--line); margin-bottom:20px; }
  .wed-directions h4{ font-size:14px; color:var(--gold-dim); margin:18px 0 8px; }
  .wed-directions p{ font-size:14px; color:#3A473F; margin-bottom:6px; line-height:1.6; }
  .wed-map-links{ display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
  .wed-map-links a{ font-size:13px; font-weight:700; padding:8px 16px; border:1px solid var(--line); background:var(--chalk); color:var(--ink); }
  .wed-map-links a:hover{ background:var(--pitch-950); color:var(--chalk); border-color:var(--pitch-950); }
  @media (max-width:800px){
    .wed-grid{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<header>
